<text x="42" y="516" font-size="14">128×32 OLED, 3V3</text>
<text x="42" y="544" font-size="14">VCC / GND / SDA / SCL</text>
<rect x="390" y="430" width="245" height="150" rx="8" fill="#edf4fa" stroke="#395775"/>
<text x="402" y="458" font-size="17" font-weight="bold">VL53L0X · 0x29</text>
