<g fill="none" stroke="#326b9c" stroke-width="3"><path d="M260 200 H390"/><path d="M145 350 V430"/><path d="M145 390 H512 V430"/><path d="M635 200 H770"/><path d="M885 430 V240"/><path d="M770 510 H690 V320 H635"/></g><text x="275" y="185" font-size="14">I2C + OE</text><text x="650" y="185" font-size="11">0–4,12–14</text><text x="30" y="630" font-size="16">All grounds common. I2C pull-ups to 3V3. PCA VCC ≠ servo V+.</text><text x="30" y="660" font-size="16">See schematic.md for exact net mapping, OE pull-up and power notes.</text><rect x="30" y="700" width="975" height="155" rx="8" fill="#edf4fa" stroke="#395775"/>
<text x="42" y="726" font-size="17" font-weight="bold">Battery sense · GPIO3 / ADC1_CH3 · 2S Li-ion/LiPo · 8.4 V full</text>
<text x="42" y="755" font-size="16">Battery + → 100 kΩ → GPIO3 → 22 kΩ → common GND / Battery −</text>
<text x="42" y="783" font-size="16">100 nF: GPIO3 to GND, near ESP32. Divider resistors: 1%.</text>
<text x="42" y="811" font-size="16">8.4 V battery → 1.515 V ADC. Never connect battery directly to GPIO3.</text>
<text x="42" y="839" font-size="16">Disconnect sense when ESP32 is off. Confirm pack voltage and divider before wiring.</text>
